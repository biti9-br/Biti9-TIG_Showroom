# Build, push e deploy no Cloud Run.
#
# Substituições obrigatórias (defina no trigger):
#   _IMAGE   caminho da imagem sem tag, ex.: us-central1-docker.pkg.dev/<projeto>/<repo>/showroom
#   _SERVICE nome do serviço no Cloud Run
#   _REGION  região do serviço no Cloud Run
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${COMMIT_SHA}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}

options:
  logging: CLOUD_LOGGING_ONLY
